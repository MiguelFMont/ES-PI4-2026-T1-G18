<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceAI</title>
    <!-- Fonte Nunito (Google Fonts). Cada página nova do Frontend precisa destes três <link>. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="./src/core/styles/global.css">    
    <!-- O estilo com sombras ou com bordas se escolhe em Minha conta > Preferências (core/theme/theme.js);
         as variáveis dos dois estão no próprio global.css. -->
    <link rel="stylesheet" href="./src/shared/styles/notificacao.css">
    <link rel="stylesheet" href="./src/features/Perfil/styles/ReportarProblema.css">
</head>
<body>
    <!-- Header ou Navbar (SerÃ¡ injetado ou fixo aqui) -->
    <header id="main-header">
        <div class="menu-lateral">
            <div class="menu-lateral__topo">
                <p class="menu-lateral__marca"><span class="menu-lateral__logo" aria-hidden="true">F</span><span class="menu-texto">FinanceAI</span></p>
                <button type="button" id="botao-recolher-menu" class="menu-lateral__recolher" aria-expanded="true" aria-controls="menu-principal" aria-label="Recolher menu">
                    <svg class="menu-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/></svg>
                </button>
            </div>
            <nav class="main-nav" id="menu-principal" aria-label="Principal">
                <div class="main-nav__grupo" role="group" aria-labelledby="menu-grupo-geral">
                    <p class="main-nav__titulo menu-texto" id="menu-grupo-geral">Geral</p>
                    <a href="#dashboard" data-rota="dashboard">
                        <svg class="menu-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
                        <span class="menu-texto">Início</span>
                    </a>
                </div>
                <div class="main-nav__grupo" role="group" aria-labelledby="menu-grupo-financas">
                    <p class="main-nav__titulo menu-texto" id="menu-grupo-financas">Finanças</p>
                    <a href="#transactions" data-rota="transactions">
                        <svg class="menu-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 7h13"/><path d="m16 3 4 4-4 4"/><path d="M17 17H4"/><path d="m8 13-4 4 4 4"/></svg>
                        <span class="menu-texto">Transações</span>
                    </a>
                    <a href="#contas-conectadas" data-rota="contas-conectadas">
                        <svg class="menu-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
                        <span class="menu-texto">Contas conectadas</span>
                    </a>
                    <a href="#cartao" data-rota="cartao">
                        <svg class="menu-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h3"/></svg>
                        <span class="menu-texto">Cartão</span>
                    </a>
                </div>
                <div class="main-nav__grupo" role="group" aria-labelledby="menu-grupo-planejamento">
                    <p class="main-nav__titulo menu-texto" id="menu-grupo-planejamento">Planejamento</p>
                    <a href="#metas" data-rota="metas">
                        <svg class="menu-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
                        <span class="menu-texto">Metas</span>
                    </a>
                    <a href="#mentor-ia" data-rota="mentor-ia">
                        <svg class="menu-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
                        <span class="menu-texto">Mentor IA</span>
                    </a>
                </div>
            </nav>
            <div class="menu-lateral__rodape">
                <div class="main-nav__grupo main-nav__grupo--conta" role="group" aria-label="Conta">
                    <a href="#perfil" data-rota="perfil">
                        <svg class="menu-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                        <span class="menu-texto">Minha conta</span>
                    </a>
                </div>
                <button type="button" id="botao-tema">
                    <svg class="menu-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    <span class="menu-texto">Tema claro</span>
                </button>
                <button type="button" id="botao-ocultar-valores" aria-pressed="false">
                    <svg class="menu-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                    <span class="menu-texto">Ocultar valores</span>
                </button>
                <button type="button" id="botao-sair">
                    <svg class="menu-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
                    <span class="menu-texto">Sair</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Ãrea principal onde as telas serÃ£o renderizadas -->
    <main id="app-content">
        <!-- O main.js vai injetar as telas (ex: login.html, dashboard.html) aqui -->
    </main>

    <!-- Ponto de entrada do JavaScript -->
    <!-- Dica animada dos ícones do menu recolhido (posicionada por core/layout/dicaMenu.js) -->
    <div id="dica-menu" class="dica-menu" aria-hidden="true"><span class="dica-menu__texto"></span></div>

    <script type="module" src="./src/app/main.js"></script>
</body>
</html>
