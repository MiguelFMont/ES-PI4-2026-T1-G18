<!-- Componente: 4 Cartões de Resumo Financeiro no padrão da imagem de referência -->
<div class="dashboard-kpis" aria-label="Resumo financeiro">
    <article class="transactions-cartao dashboard-kpi">
        <span class="dashboard-kpi__rotulo">Saldo Atual</span>
        <strong id="resumo-saldo" class="dashboard-kpi__valor valor-financeiro">R$ 0,00</strong>
        <span id="dash-kpi-saldo-var" class="dashboard-kpi__variacao dashboard-kpi__variacao--positiva">+0% vs mês anterior</span>
    </article>

    <article class="transactions-cartao dashboard-kpi">
        <span class="dashboard-kpi__rotulo">Receitas</span>
        <strong id="resumo-entradas" class="dashboard-kpi__valor valor-financeiro">R$ 0,00</strong>
        <span id="dash-kpi-receitas-var" class="dashboard-kpi__variacao dashboard-kpi__variacao--positiva">+0% vs mês anterior</span>
    </article>

    <article class="transactions-cartao dashboard-kpi">
        <span class="dashboard-kpi__rotulo">Despesas</span>
        <strong id="resumo-saidas" class="dashboard-kpi__valor valor-financeiro">R$ 0,00</strong>
        <span id="dash-kpi-despesas-var" class="dashboard-kpi__variacao dashboard-kpi__variacao--negativa">+0% vs mês anterior</span>
    </article>

    <article class="transactions-cartao dashboard-kpi">
        <span class="dashboard-kpi__rotulo">Meta de Economia</span>
        <strong id="dash-kpi-economia" class="dashboard-kpi__valor valor-financeiro">R$ 0,00</strong>
        <div class="dashboard-kpi__meta-rodape">
        <span id="dash-kpi-meta-texto" class="dashboard-kpi__meta-pct">0% da meta (30% da renda)</span>
        <div class="dashboard-kpi__meta-trilha">
            <div id="dash-kpi-meta-barra" class="dashboard-kpi__meta-preenchimento" style="width: 0%"></div>
        </div>
        </div>
    </article>
</div>
