<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar e-mail - FinanceAI</title>
    <link rel="stylesheet" href="./confirmarEmail.css">
</head>
<body>
    <div class="container">
        <h1>Finance<span>AI</span></h1>
        <h2>Verificação de e-mail</h2>
        <p id="mensagem">Verificando seu e-mail...</p>
    </div>

    <script>
        async function confirmarEmail() {
            const token = new URLSearchParams(window.location.search).get("token");
            const mensagem = document.getElementById("mensagem");

            if (!token) {
                mensagem.textContent = "Token de confirmação não encontrado.";
                return;
            }

            try {
                const resposta = await fetch("/v1/auth/verify-email", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(dados.message || "Erro ao confirmar e-mail.");
                }

                mensagem.textContent = "E-mail confirmado com sucesso! Você já pode fazer login.";
            } catch (erro) {
                mensagem.textContent = erro instanceof Error
                    ? erro.message
                    : "Não foi possível confirmar seu e-mail.";
            }
        }

        confirmarEmail();
    </script>
    <script src="./confirmarEmail.js"></script>
</body>
</html>
