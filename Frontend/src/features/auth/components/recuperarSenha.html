<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceAI</title>
    <link rel="stylesheet" href="../../../core/styles/global.css">
    <link rel="stylesheet" href="../styles/recuperarSenha.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h2 class="title">Recuperar Senha</h2>
            <p class="description">Informe seu e-mail cadastrado para recuperar sua senha</p>

            <form class="form" id="recuperar-form">
                <input type="email" id="recuperar-email" placeholder="Email" required>
                <p id="recuperar-erro" role="alert" aria-live="polite"></p>
                <button class="btn" type="submit">Continuar</button>
            </form>

            <a class="password" href="inicio.html">Voltar ao login</a>
        </div>
    </div>
    <script type="module" src="recuperarSenha.js"></script>
</body>
</html>
