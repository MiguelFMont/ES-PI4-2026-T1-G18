<!--
  Tela do Cartão de crédito (fatura, limite e parcelamentos SIMULADOS), um fragmento: não é um documento completo. O index.html (menu,
  fontes e estilos globais) fica sempre aberto e o roteador (app/main.js) coloca este conteúdo em #app-content, junto com
  os CSS da tela. Toda a estrutura é HTML (este arquivo e os componentes); o JavaScript só junta os componentes e liga a
  lógica pelos ids (chamar a API, validar, mostrar e esconder estados, preencher textos).
  Os caminhos começam em / (a raiz do Frontend).
-->
<section class="investments-page" aria-labelledby="investments-titulo">
    <div class="investments-cabecalho">
        <h1 id="investments-titulo">Cartão de crédito</h1>
        <p class="investments-subtitulo">Cartão de crédito simulado: a fatura vem das suas despesas no crédito; limite e parcelamentos são fictícios.</p>
    </div>

    <p id="investments-carregando" class="investments-estado">Carregando seu cartão...</p>

    <div id="investments-erro" class="investments-estado" hidden>
        <p id="investments-erro-texto" role="alert"></p>
        <button type="button" id="investments-tentar-novamente" class="investments-botao">Tentar novamente</button>
    </div>

    <div id="investments-conteudo" class="investments-conteudo" hidden>
        <div data-incluir="/src/features/investments/components/CardResumo/CardResumo.html"></div>
        <div data-incluir="/src/features/investments/components/CardInstallments/CardInstallments.html"></div>
    </div>
</section>
