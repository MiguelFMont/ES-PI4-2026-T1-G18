<!-- Componente: um card para cada cartão do usuário, já com a fatura do mês, o vencimento, o limite e os totais, mais o card
     para adicionar outro. Lógica em CartoesLista.js. Cada card é feito a partir dos <template> no fim deste arquivo. -->
<section aria-labelledby="invest-cartoes-titulo">
  <h2 id="invest-cartoes-titulo" class="so-leitor">Seus cartões</h2>
  <ul id="invest-cartoes-lista" class="investments-cartoes"></ul>
</section>

<!-- Modelo de um cartão: o JS copia este bloco para cada cartão e só preenche os textos. -->
<template id="modelo-cartao">
  <li class="investments-cartao-card">
    <div class="investments-cartao-card__topo">
      <div class="investments-cartao-card__nome">
        <h3 data-campo="nome"></h3>
        <span class="investments-etiqueta" data-campo="padrao" hidden>Padrão</span>
      </div>
      <div class="investments-acoes">
        <button type="button" class="investments-botao investments-botao--pequeno investments-botao--secundario" data-acao="editar">Editar</button>
        <button type="button" class="investments-botao investments-botao--pequeno investments-botao--perigo" data-acao="excluir">Excluir</button>
      </div>
    </div>

    <div>
      <p class="investments-texto-suave">Fatura de <span data-campo="mes"></span></p>
      <p class="investments-fatura__valor valor-financeiro" data-campo="faturaValor"></p>
      <p class="investments-texto-suave" data-campo="vencimento"></p>
    </div>

    <div class="investments-limite">
      <p>
        Limite disponível: <strong class="valor-financeiro" data-campo="limiteDisponivel"></strong>
        <span class="investments-texto-suave">de <span class="valor-financeiro" data-campo="limiteTotal"></span></span>
      </p>
      <div class="investments-barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Uso do limite do cartão" data-campo="barra">
        <div class="investments-barra__preenchida"></div>
      </div>
      <p class="investments-aviso" role="status" data-campo="aviso" hidden></p>
    </div>

    <dl class="investments-detalhes">
      <div>
        <dt>Compras no crédito</dt>
        <dd class="valor-financeiro" data-campo="compras"></dd>
      </div>
      <div>
        <dt>Parcelas do mês</dt>
        <dd class="valor-financeiro" data-campo="parcelas"></dd>
      </div>
      <div>
        <dt>Saldo devedor</dt>
        <dd class="valor-financeiro" data-campo="saldoDevedor"></dd>
      </div>
    </dl>
  </li>
</template>

<!-- Modelo do card que adiciona um cartão novo -->
<template id="modelo-cartao-novo">
  <li class="investments-cartao-novo">
    <button type="button" id="invest-cartao-novo" class="investments-cartao-novo__botao" aria-controls="invest-cartao-form-area">
      <span class="investments-cartao-novo__mais" aria-hidden="true">+</span>
      <span>Novo cartão</span>
    </button>
  </li>
</template>
