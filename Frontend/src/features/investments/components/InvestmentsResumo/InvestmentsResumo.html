<!-- Componente: resumo do patrimônio (patrimônio total, investido, rendimento e rentabilidade). Lógica em InvestmentsResumo.js. -->
<dl class="investments-resumo" aria-label="Resumo do patrimônio simulado">
  <div class="investments-resumo__item investments-resumo__item--destaque">
    <dt>Patrimônio total</dt>
    <dd id="invest-patrimonio" class="valor-financeiro"></dd>
  </div>
  <div class="investments-resumo__item">
    <dt>Total investido</dt>
    <dd id="invest-investido" class="valor-financeiro"></dd>
  </div>
  <div class="investments-resumo__item">
    <dt>Rendimento</dt>
    <dd id="invest-rendimento" class="valor-financeiro"></dd>
  </div>
  <div class="investments-resumo__item">
    <dt>Rentabilidade</dt>
    <dd id="invest-rentabilidade"></dd>
  </div>
</dl>
