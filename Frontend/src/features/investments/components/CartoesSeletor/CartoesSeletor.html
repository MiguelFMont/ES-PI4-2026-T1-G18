<!-- Componente: os cartões do usuário, um botão para cada um (o escolhido fica marcado) e o botão de adicionar outro.
     Lógica em CartoesSeletor.js. Cada botão é feito a partir do <template> no fim deste arquivo. -->
<section class="investments-cartoes" aria-labelledby="invest-cartoes-titulo">
  <h2 id="invest-cartoes-titulo" class="so-leitor">Seus cartões</h2>
  <div id="invest-cartoes-lista" class="investments-cartoes__lista" role="group" aria-labelledby="invest-cartoes-titulo"></div>
  <button type="button" id="invest-cartao-novo" class="investments-botao investments-botao--secundario" aria-controls="invest-cartao-form">Novo cartão</button>
</section>

<template id="modelo-chip-cartao">
  <button type="button" class="investments-chip" aria-pressed="false">
    <span class="investments-chip__nome" data-campo="nome"></span>
    <span class="investments-chip__fatura investments-texto-suave" data-campo="fatura"></span>
  </button>
</template>
