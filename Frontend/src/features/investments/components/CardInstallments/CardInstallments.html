<!-- Componente: parcelamentos ativos do cartão (parcela, juros e saldo devedor), com o formulário de novo parcelamento.
     Lógica em CardInstallments.js. As contas (tabela Price) são feitas pelo Servidor Java. -->
<section class="investments-cartao" aria-labelledby="invest-parcelas-titulo">
  <div class="investments-secao-topo">
    <h2 id="invest-parcelas-titulo">Parcelamentos do cartão</h2>
    <button type="button" id="invest-novo-parcelamento" class="investments-botao" aria-expanded="false" aria-controls="invest-parcelamento-form">Novo parcelamento</button>
  </div>

  <form id="invest-parcelamento-form" class="investments-form" novalidate hidden>
    <div class="campo investments-campo--larga">
      <label for="invest-parc-descricao">Descrição *</label>
      <input type="text" id="invest-parc-descricao" name="descricao" maxlength="100" placeholder="Ex: Notebook, Geladeira" autocomplete="off">
      <p class="campo__erro" id="invest-parc-descricao-erro" hidden></p>
    </div>
    <div class="campo">
      <label for="invest-parc-valor">Valor total (R$) *</label>
      <input type="text" id="invest-parc-valor" name="valorTotal" inputmode="decimal" placeholder="0,00" autocomplete="off">
      <p class="campo__erro" id="invest-parc-valor-erro" hidden></p>
    </div>
    <div class="campo">
      <label for="invest-parc-parcelas">Número de parcelas *</label>
      <input type="text" id="invest-parc-parcelas" name="parcelas" inputmode="numeric" maxlength="3" placeholder="12" autocomplete="off">
      <p class="campo__erro" id="invest-parc-parcelas-erro" hidden></p>
    </div>
    <div class="campo">
      <label for="invest-parc-pagas">Parcelas já pagas</label>
      <input type="text" id="invest-parc-pagas" name="parcelasPagas" inputmode="numeric" maxlength="3" placeholder="0" autocomplete="off">
      <p class="campo__erro" id="invest-parc-pagas-erro" hidden></p>
    </div>
    <div class="campo">
      <label for="invest-parc-juros">Juros ao mês (%)</label>
      <input type="text" id="invest-parc-juros" name="taxaJurosMensal" inputmode="decimal" placeholder="0,00" autocomplete="off">
      <p class="campo__erro" id="invest-parc-juros-erro" hidden></p>
    </div>
    <div class="investments-acoes investments-campo--larga">
      <button type="submit" id="invest-parc-salvar" class="investments-botao">Salvar parcelamento</button>
      <button type="button" id="invest-parc-cancelar" class="investments-botao investments-botao--secundario">Cancelar</button>
    </div>
  </form>

  <p id="invest-parcelas-vazio" class="investments-vazio" hidden>
    Nenhum parcelamento ativo. Clique em "Novo parcelamento" para simular um.
  </p>

  <div id="invest-parcelas-conteudo" hidden>
    <dl class="investments-detalhes" aria-label="Totais dos parcelamentos ativos">
      <div>
        <dt>Parcelas do mês</dt>
        <dd id="invest-parcelas-total-mes" class="valor-financeiro"></dd>
      </div>
      <div>
        <dt>Saldo devedor total</dt>
        <dd id="invest-parcelas-total-saldo" class="valor-financeiro"></dd>
      </div>
      <div>
        <dt>Juros a pagar</dt>
        <dd id="invest-parcelas-total-juros" class="valor-financeiro"></dd>
      </div>
    </dl>
    <ul id="invest-parcelas-itens" class="investments-itens" aria-label="Parcelamentos"></ul>
  </div>
</section>

<!-- Modelo de um parcelamento: o JS copia este bloco para cada um e só preenche os textos. -->
<template id="modelo-parcelamento">
  <li class="investments-parcelamento">
    <div class="investments-parcelamento__topo">
      <h3 data-campo="descricao"></h3>
      <span class="investments-status" data-campo="status"></span>
    </div>
    <p class="investments-texto-suave" data-campo="resumo"></p>
    <dl class="investments-detalhes">
      <div>
        <dt>Valor da parcela</dt>
        <dd class="valor-financeiro" data-campo="parcela"></dd>
      </div>
      <div>
        <dt>Saldo devedor</dt>
        <dd class="valor-financeiro" data-campo="saldo"></dd>
      </div>
      <div>
        <dt>Juros no total</dt>
        <dd class="valor-financeiro" data-campo="juros"></dd>
      </div>
    </dl>
    <div class="investments-acoes">
      <button type="button" class="investments-botao investments-botao--secundario" data-acao="pagar">Pagar uma parcela</button>
      <button type="button" class="investments-botao investments-botao--perigo" data-acao="excluir">Excluir</button>
      <p class="investments-texto-suave" data-campo="deCompra" hidden>Criado por uma compra em Transações: para remover, exclua a transação.</p>
    </div>
  </li>
</template>
