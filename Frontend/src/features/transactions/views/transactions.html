<!--
  Tela de Transações (extrato), um fragmento: não é um documento completo. O index.html (menu, fontes e
  estilos globais) fica sempre aberto e o roteador (app/main.js) coloca este conteúdo em #app-content, junto
  com os CSS da tela. Toda a estrutura é HTML (este arquivo e os componentes); o JavaScript só junta os
  componentes e liga a lógica pelos ids (consultar a API, abrir os detalhes, editar e excluir).
  Os caminhos começam em / (a raiz do Frontend).

  Layout: um cartão com a barra do topo (lançamento, mês, selecionar, filtros e busca) e a lista agrupada por dia.
  Os detalhes de uma transação abrem num painel à direita e o formulário de nova transação desce do topo.
-->
<section class="transactions-page" aria-label="Transações">
    <!-- Componentes da tela: cada um é um arquivo HTML em components/<Nome>/, incluído aqui pelo JS (core/views/includes.js). -->
    <div class="transactions-novo">
        <div data-incluir="/src/features/transactions/components/TransactionBarra/TransactionBarra.html"></div>
        <div data-incluir="/src/features/transactions/components/TransactionLista/TransactionLista.html"></div>
    </div>
    <div data-incluir="/src/features/transactions/components/TransactionForm/TransactionForm.html"></div>
    <div data-incluir="/src/features/transactions/components/TransactionDetalhe/TransactionDetalhe.html"></div>
    <div data-incluir="/src/features/transactions/components/TransactionCartao/TransactionCartao.html"></div>
</section>
