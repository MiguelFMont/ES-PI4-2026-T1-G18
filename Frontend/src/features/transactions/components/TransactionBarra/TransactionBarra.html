<!-- Componente: barra do topo das transações. Lógica em TransactionBarra.js.
     Primeira linha: à esquerda os botões "Lançamento" (abre o formulário de nova transação) e "Selecionar" (marcar várias transações),
     no meio o mês com setas e à direita o "Limpar filtros" (quando há filtro ligado). A busca por descrição fica no cabeçalho da coluna Descrição.
     Os filtros ficam no cabeçalho das colunas da lista (TransactionLista.html, atributos data-filtro) nas telas largas; nas telas
     estreitas, em que as colunas somem, eles aparecem num painel recolhível logo abaixo (#barra-filtros-painel). -->
<header class="barra">
  <div class="barra__linha barra__topo">
    <div class="barra__acoes">
    <!-- Ao passar o mouse (ou focar) o próprio botão se expande, com uma animação, até o tamanho da caixa que mostra Nova despesa e
         Nova receita, cada uma com a sua letra de atalho. O clique no botão (fechado) abre o formulário como antes. -->
    <div id="barra-novo-area" class="barra__novo-area">
      <button type="button" id="botao-alternar-form" class="barra__novo" aria-haspopup="dialog" aria-expanded="false" aria-controls="transactions-painel-form">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span>Lançamento</span>
      </button>

      <div id="barra-novo-menu" class="barra__novo-menu" role="menu" aria-label="Novo lançamento" aria-hidden="true">
        <button type="button" class="barra__novo-item" role="menuitem" data-tipo="despesa">
          <span class="barra__novo-icone barra__novo-icone--despesa" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 15.5l7-7M10.5 8.5h5v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="barra__novo-nome">Nova despesa</span>
          <kbd class="barra__novo-tecla">letra D</kbd>
        </button>
        <button type="button" class="barra__novo-item" role="menuitem" data-tipo="receita">
          <span class="barra__novo-icone barra__novo-icone--receita" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 8.5l-7 7M13.5 15.5h-5v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="barra__novo-nome">Nova receita</span>
          <kbd class="barra__novo-tecla">letra R</kbd>
        </button>
      </div>
    </div>

      <button type="button" id="barra-selecionar" class="barra__selecionar" aria-pressed="false">
        <svg class="barra__selecionar-icone barra__selecionar-icone--marcar" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 12.5l2.7 2.7L16 9.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="barra__selecionar-icone barra__selecionar-icone--cancelar" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 9l6 6M15 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span id="barra-selecionar-texto">Selecionar</span>
      </button>
    </div>

    <div class="barra__mes" role="group" aria-label="Mês">
      <button type="button" id="barra-mes-anterior" class="barra__seta" aria-label="Mês anterior">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 class="so-leitor">Transações</h1>
      <!-- Clicar no mês abre o calendário de período (o mesmo do filtro: dois dias e os atalhos, como "30 dias" e "Tudo") -->
      <div class="barra__mes-area">
        <button type="button" id="barra-mes-botao" class="barra__mes-botao" aria-haspopup="dialog" aria-expanded="false" aria-controls="barra-periodo" title="Escolher um período">
          <span id="barra-mes" class="barra__mes-texto" aria-live="polite"></span>
        </button>

        <div id="barra-periodo" class="barra__periodo" hidden>
          <fieldset class="campo campo--periodo periodo" data-calendario data-ao-clicar>
            <legend>Período</legend>
            <div class="periodo__caixas">
              <div class="periodo__item">
                <label for="barra-periodo-inicio">Início</label>
                <input type="text" id="barra-periodo-inicio" class="calendario__caixa periodo__caixa" placeholder="dd/mm/aaaa"
                  inputmode="numeric" maxlength="10" autocomplete="off" aria-haspopup="dialog" aria-expanded="false">
              </div>
              <div class="periodo__item">
                <label for="barra-periodo-fim">Final</label>
                <input type="text" id="barra-periodo-fim" class="calendario__caixa periodo__caixa" placeholder="dd/mm/aaaa"
                  inputmode="numeric" maxlength="10" autocomplete="off" aria-haspopup="dialog" aria-expanded="false">
              </div>
            </div>
            <div data-incluir="/src/shared/components/calendario/Calendario.html"></div>
            <p class="campo__erro" id="barra-periodo-erro" hidden></p>
          </fieldset>
        </div>
      </div>
      <button type="button" id="barra-mes-seguinte" class="barra__seta" aria-label="Próximo mês">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="barra__direita">
      <button type="button" id="barra-limpar-filtros" class="barra__limpar" hidden>
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span>Limpar filtros</span>
      </button>
    </div>
  </div>

  <!-- Só em tela estreita: um botão que mostra e esconde os filtros (nas telas largas eles ficam no cabeçalho das colunas) -->
  <button type="button" id="barra-filtros-toggle" class="barra__filtros-toggle" aria-expanded="true" aria-controls="barra-filtros-painel">
    <span id="barra-filtros-toggle-texto">Ocultar filtros</span>
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div id="barra-filtros-painel" class="barra__filtros-painel">
    <div id="barra-pilulas" class="barra__pilulas barra__faixa" role="group" aria-label="Filtros"></div>
  </div>
</header>
