<section class="perfil-conta">
    <div class="secao-cabecalho">
        <h2>Meu perfil</h2>
        <p>Confira as informações da sua conta.</p>
    </div>
    <form id="formulario-perfil" class="perfil-conta__dados">
    <div class="perfil-conta__dados">
        <div class="campo-perfil">
            <label for="perfil-nome">Nome</label>
            <input type="text" id="perfil-nome"required>
        </div>
        <div class="campo-perfil">
            <label for="perfil-email">E-mail</label>
            <input type="email" id="perfil-email" readonly></div>
        <div class="campo-perfil">
            <label for="perfil-plano">Plano atual</label>
            <input type="text" id="perfil-plano" readonly>
        </div>
        <button type="submit" id="salvar-perfil">
            Salvar alterações
        </button>
    </div>
    </form>
        <p id="perfil-mensagem" role="status"></p>
    </div>
</section>
