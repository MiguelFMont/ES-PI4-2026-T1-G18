<section class="preferencias-conta">

    </div>
    <div class="preferencias-conta__lista">
        <div class="preferencia-item">
            <div class="preferencia-item__informacoes">
                <h3 id="preferencia-estilo-titulo">Estilo da interface</h3>
                <p id="preferencia-estilo-descricao">Com sombras, os cartões e campos se destacam por sombras suaves. Com bordas, por linhas finas.</p>
            </div>
            <div class="preferencia-item__controle">
                <span class="interruptor__estado" id="preferencia-estilo-estado" aria-hidden="true">Com sombras</span>
                <button type="button" id="preferencia-estilo" class="interruptor" role="switch" aria-checked="true"
                    aria-labelledby="preferencia-estilo-titulo" aria-describedby="preferencia-estilo-descricao">
                    <span class="interruptor__bolinha"></span>
                </button>
            </div>
        </div>

    <p id="preferencias-mensagem" role="status"></p>
